<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --slide-w: 720pt;
        --slide-h: 405pt;
        --safe-top: 28pt;
        --safe-right: 36pt;
        --safe-bottom: 28pt;
        --safe-left: 36pt;
        --bg: #f6f7f4;
        --ink: #14171a;
        --muted: #65706c;
        --accent: #e05d3f;
        --support: #0b7c75;
        --plum: #6d597a;
        --panel: #ffffff;
        --line: #d7ddd5;
        --charcoal: #151b1f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: var(--slide-w);
        height: var(--slide-h);
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
      }

      h1,
      h2,
      p {
        margin: 0;
        padding: 0;
      }

      .safe {
        width: 100%;
        height: 100%;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        display: grid;
        grid-template-columns: 222pt minmax(0, 1fr);
        gap: 20pt;
        position: relative;
        overflow: hidden;
      }

      .intro {
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 4pt 0 2pt;
      }

      .topline {
        display: flex;
        align-items: center;
        gap: 9pt;
      }

      .accent {
        width: 34pt;
        height: 4pt;
        background: var(--accent);
      }

      .label {
        font-size: 8.5pt;
        line-height: 1;
        color: var(--muted);
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        max-width: 215pt;
        font-size: 30pt;
        line-height: 1.06;
        letter-spacing: 0;
        color: var(--ink);
      }

      .lead {
        max-width: 208pt;
        font-size: 12.8pt;
        line-height: 1.34;
        color: var(--muted);
      }

      .intro-rule {
        width: 112pt;
        height: 1pt;
        background: var(--line);
      }

      .grid {
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 10pt;
      }

      .card {
        min-height: 0;
        background: var(--panel);
        border: 1pt solid var(--line);
        border-radius: 8pt;
        padding: 12pt 13pt;
        display: flex;
        flex-direction: column;
        gap: 7pt;
        position: relative;
        overflow: hidden;
      }

      .card-band {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4pt;
        background: var(--support);
      }

      .card:nth-child(2) .card-band,
      .card:nth-child(3) .card-band {
        background: var(--accent);
      }

      .metric-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8pt;
      }

      .metric {
        font-size: 25pt;
        line-height: 1;
        font-weight: 700;
        color: var(--ink);
      }

      .dot {
        width: 7pt;
        height: 7pt;
        border-radius: 4pt;
        background: var(--plum);
      }

      h2 {
        font-size: 12.3pt;
        line-height: 1.16;
        color: var(--ink);
      }

      .text {
        font-size: 10.7pt;
        line-height: 1.26;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="safe">
      <div class="intro">
        <div class="topline">
          <div class="accent"></div>
          <p class="label">{{SECTION}}</p>
        </div>
        <h1>{{TITLE}}</h1>
        <p class="lead">{{LEAD_IN}}</p>
        <div class="intro-rule"></div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="card-band"></div>
          <div class="metric-row">
            <p class="metric">{{METRIC_1}}</p>
            <div class="dot"></div>
          </div>
          <h2>{{METRIC_LABEL_1}}</h2>
          <p class="text">{{METRIC_TEXT_1}}</p>
        </div>
        <div class="card">
          <div class="card-band"></div>
          <div class="metric-row">
            <p class="metric">{{METRIC_2}}</p>
            <div class="dot"></div>
          </div>
          <h2>{{METRIC_LABEL_2}}</h2>
          <p class="text">{{METRIC_TEXT_2}}</p>
        </div>
        <div class="card">
          <div class="card-band"></div>
          <div class="metric-row">
            <p class="metric">{{METRIC_3}}</p>
            <div class="dot"></div>
          </div>
          <h2>{{METRIC_LABEL_3}}</h2>
          <p class="text">{{METRIC_TEXT_3}}</p>
        </div>
        <div class="card">
          <div class="card-band"></div>
          <div class="metric-row">
            <p class="metric">{{METRIC_4}}</p>
            <div class="dot"></div>
          </div>
          <h2>{{METRIC_LABEL_4}}</h2>
          <p class="text">{{METRIC_TEXT_4}}</p>
        </div>
      </div>
    </div>
  </body>
</html>
