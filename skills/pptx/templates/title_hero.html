<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --slide-w: 720pt;
        --slide-h: 405pt;
        --safe-top: 34pt;
        --safe-right: 40pt;
        --safe-bottom: 30pt;
        --safe-left: 44pt;
        --bg: #f6f7f4;
        --ink: #14171a;
        --muted: #65706c;
        --accent: #e05d3f;
        --support: #0b7c75;
        --plum: #6d597a;
        --panel: #ffffff;
        --line: #d7ddd5;
        --charcoal: #151b1f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: var(--slide-w);
        height: var(--slide-h);
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
      }

      h1,
      p {
        margin: 0;
        padding: 0;
      }

      .safe {
        width: 100%;
        height: 100%;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 158pt;
        gap: 28pt;
        overflow: hidden;
      }

      .side-slab {
        position: absolute;
        top: 0;
        right: 0;
        width: 202pt;
        height: 100%;
        background: var(--charcoal);
      }

      .hairline {
        position: absolute;
        left: var(--safe-left);
        right: calc(var(--safe-right) + 178pt);
        bottom: 28pt;
        height: 1pt;
        background: var(--line);
      }

      .main {
        z-index: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18pt;
      }

      .kicker {
        display: flex;
        align-items: center;
        gap: 9pt;
      }

      .kicker-mark {
        width: 32pt;
        height: 4pt;
        background: var(--accent);
      }

      .kicker p {
        font-size: 8.5pt;
        line-height: 1;
        letter-spacing: 0;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--muted);
      }

      h1 {
        max-width: 470pt;
        font-size: 46pt;
        line-height: 1.02;
        letter-spacing: 0;
        color: var(--ink);
      }

      .subtitle {
        max-width: 425pt;
        font-size: 17.5pt;
        line-height: 1.28;
        color: var(--muted);
      }

      .rail {
        z-index: 1;
        min-height: 0;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18pt;
      }

      .accent-card {
        width: 58pt;
        height: 58pt;
        border-radius: 8pt;
        background: var(--accent);
        border: 1pt solid #f28b72;
      }

      .rail-rule {
        width: 100%;
        height: 1pt;
        background: #3b474c;
      }

      .note {
        max-width: 118pt;
        font-size: 10.5pt;
        line-height: 1.34;
        color: #dfe7e4;
      }

      .footer {
        position: absolute;
        left: var(--safe-left);
        bottom: 16pt;
        z-index: 1;
      }

      .footer p {
        font-size: 8.5pt;
        line-height: 1;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="safe">
      <div class="side-slab"></div>
      <div class="hairline"></div>

      <div class="main">
        <div class="kicker">
          <div class="kicker-mark"></div>
          <p>{{EYEBROW}}</p>
        </div>
        <h1>{{TITLE}}</h1>
        <p class="subtitle">{{SUBTITLE}}</p>
      </div>

      <div class="rail">
        <div class="accent-card"></div>
        <div class="rail-rule"></div>
        <p class="note">{{CONTEXT_NOTE}}</p>
      </div>

      <div class="footer">
        <p>{{FOOTER}}</p>
      </div>
    </div>
  </body>
</html>
