<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --slide-w: 720pt;
        --slide-h: 405pt;
        --safe-top: 30pt;
        --safe-right: 38pt;
        --safe-bottom: 30pt;
        --safe-left: 38pt;
        --bg: #f6f7f4;
        --ink: #14171a;
        --muted: #65706c;
        --accent: #e05d3f;
        --support: #0b7c75;
        --plum: #6d597a;
        --panel: #ffffff;
        --line: #d7ddd5;
        --charcoal: #151b1f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: var(--slide-w);
        height: var(--slide-h);
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
      }

      h1,
      h2,
      p,
      ul,
      li {
        margin: 0;
        padding: 0;
      }

      .safe {
        width: 100%;
        height: 100%;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 292pt;
        gap: 20pt;
        position: relative;
        overflow: hidden;
      }

      .left {
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .topline {
        display: flex;
        align-items: center;
        gap: 9pt;
      }

      .accent {
        width: 34pt;
        height: 4pt;
        background: var(--accent);
      }

      .label {
        font-size: 8.5pt;
        line-height: 1;
        color: var(--muted);
        font-weight: 700;
        text-transform: uppercase;
      }

      .title-block {
        display: flex;
        flex-direction: column;
        gap: 12pt;
      }

      h1 {
        max-width: 290pt;
        font-size: 33pt;
        line-height: 1.06;
        letter-spacing: 0;
        color: var(--ink);
      }

      .lead {
        max-width: 285pt;
        font-size: 13.5pt;
        line-height: 1.3;
        color: var(--muted);
      }

      .action {
        background: var(--charcoal);
        border-radius: 8pt;
        padding: 15pt 16pt;
        display: flex;
        flex-direction: column;
        gap: 7pt;
      }

      .action .label {
        color: #b7c5c1;
      }

      .action p:last-child {
        font-size: 12.7pt;
        line-height: 1.28;
        color: #ffffff;
      }

      .right {
        min-height: 0;
        background: var(--panel);
        border: 1pt solid var(--line);
        border-radius: 8pt;
        padding: 19pt;
        display: flex;
        flex-direction: column;
        gap: 15pt;
      }

      h2 {
        font-size: 20pt;
        line-height: 1.12;
        color: var(--ink);
      }

      ul {
        display: flex;
        flex-direction: column;
        gap: 10pt;
        list-style: none;
      }

      li {
        position: relative;
        padding-left: 22pt;
        font-size: 13.1pt;
        line-height: 1.26;
        color: var(--ink);
      }

      li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 4.5pt;
        width: 8pt;
        height: 8pt;
        background: var(--support);
      }

      .bottom-rule {
        position: absolute;
        left: var(--safe-left);
        right: var(--safe-right);
        bottom: 18pt;
        height: 1pt;
        background: var(--line);
      }
    </style>
  </head>
  <body>
    <div class="safe">
      <div class="bottom-rule"></div>

      <div class="left">
        <div class="topline">
          <div class="accent"></div>
          <p class="label">{{SECTION}}</p>
        </div>
        <div class="title-block">
          <h1>{{TITLE}}</h1>
          <p class="lead">{{LEAD_IN}}</p>
        </div>
        <div class="action">
          <p class="label">{{ACTION_LABEL}}</p>
          <p>{{ACTION_TEXT}}</p>
        </div>
      </div>

      <div class="right">
        <h2>{{LIST_TITLE}}</h2>
        <ul>
          <li>{{TAKEAWAY_1}}</li>
          <li>{{TAKEAWAY_2}}</li>
          <li>{{TAKEAWAY_3}}</li>
          <li>{{TAKEAWAY_4}}</li>
        </ul>
      </div>
    </div>
  </body>
</html>
