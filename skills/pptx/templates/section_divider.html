<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --slide-w: 720pt;
        --slide-h: 405pt;
        --safe-top: 34pt;
        --safe-right: 42pt;
        --safe-bottom: 30pt;
        --safe-left: 42pt;
        --bg: #151b1f;
        --ink: #ffffff;
        --muted: #b7c5c1;
        --accent: #e05d3f;
        --support: #0b7c75;
        --plum: #6d597a;
        --line: #3d484d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: var(--slide-w);
        height: var(--slide-h);
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
      }

      h1,
      p {
        margin: 0;
        padding: 0;
      }

      .safe {
        width: 100%;
        height: 100%;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        position: relative;
        display: grid;
        grid-template-columns: 118pt minmax(0, 1fr);
        gap: 28pt;
        overflow: hidden;
      }

      .index-panel {
        align-self: center;
        height: 205pt;
        border: 1pt solid var(--line);
        border-radius: 8pt;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16pt;
      }

      .mark {
        width: 42pt;
        height: 42pt;
        border-radius: 8pt;
        background: var(--accent);
      }

      .section {
        font-size: 9pt;
        line-height: 1;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--muted);
      }

      .content {
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18pt;
      }

      h1 {
        max-width: 500pt;
        font-size: 45pt;
        line-height: 1.03;
        letter-spacing: 0;
        color: var(--ink);
      }

      .rule {
        width: 148pt;
        height: 2pt;
        background: var(--support);
      }

      .subtitle {
        max-width: 455pt;
        font-size: 17pt;
        line-height: 1.3;
        color: var(--muted);
      }

      .footer {
        position: absolute;
        left: var(--safe-left);
        right: var(--safe-right);
        bottom: 19pt;
        display: flex;
        justify-content: space-between;
        border-top: 1pt solid var(--line);
        padding-top: 8pt;
      }

      .footer p {
        font-size: 8.5pt;
        line-height: 1;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="safe">
      <div class="index-panel">
        <div class="mark"></div>
        <p class="section">{{SECTION}}</p>
      </div>

      <div class="content">
        <h1>{{TITLE}}</h1>
        <div class="rule"></div>
        <p class="subtitle">{{SUBTITLE}}</p>
      </div>

      <div class="footer">
        <p>{{FOOTER_LEFT}}</p>
        <p>{{FOOTER_RIGHT}}</p>
      </div>
    </div>
  </body>
</html>
