<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --slide-w: 720pt;
        --slide-h: 405pt;
        --safe-top: 24pt;
        --safe-right: 30pt;
        --safe-bottom: 36pt;
        --safe-left: 30pt;
        --gap: 14pt;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: var(--slide-w);
        height: var(--slide-h);
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        background: #fff7d6;
        font-family: Arial, sans-serif;
      }

      h1,
      p {
        margin: 0;
        padding: 0;
      }

      .safe {
        width: 100%;
        height: 100%;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      .header {
        background: #ffffff;
        border: 2pt solid #fde68a;
        border-radius: 12pt;
        padding: 18pt 20pt;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        gap: 10pt;
      }

      .accent {
        width: 110pt;
        height: 8pt;
        background: #f2c94c;
        border-radius: 4pt;
      }

      h1 {
        font-size: 40pt;
        line-height: 1.05;
        color: #1f2937;
        letter-spacing: -0.5pt;
      }

      p {
        font-size: 18pt;
        line-height: 1.2;
        color: #374151;
      }

      .hero {
        flex: 1;
        min-height: 0;
        background: #ffffff;
        border: 2pt solid #fde68a;
        border-radius: 12pt;
        padding: 14pt;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="safe">
      <div class="header">
        <!-- Replace {{...}} placeholders with your content. -->
        <h1>{{TITLE}}</h1>
        <div class="accent"></div>
        <p>{{SUBTITLE}}</p>
      </div>

      <div class="hero">
        <img src="{{IMAGE_PATH}}" alt="Slide image" />
      </div>
    </div>
  </body>
</html>
