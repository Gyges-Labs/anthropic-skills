<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --slide-w: 720pt;
        --slide-h: 405pt;
        --safe-top: 24pt;
        --safe-right: 30pt;
        --safe-bottom: 36pt;
        --safe-left: 30pt;
        --gap: 14pt;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: var(--slide-w);
        height: var(--slide-h);
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        background: #f8fafc;
        font-family: Arial, sans-serif;
      }

      h1,
      p,
      ul,
      li {
        margin: 0;
        padding: 0;
      }

      .safe {
        width: 100%;
        height: 100%;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      .card {
        flex: 1;
        min-height: 0;
        background: #ffffff;
        border: 2pt solid #e5e7eb;
        border-radius: 12pt;
        padding: 18pt 20pt;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        gap: 14pt;
      }

      .accent {
        width: 92pt;
        height: 7pt;
        background: #f2c94c;
        border-radius: 4pt;
      }

      h1 {
        font-size: 32pt;
        line-height: 1.08;
        color: #111827;
        letter-spacing: -0.4pt;
      }

      p {
        font-size: 16pt;
        line-height: 1.22;
        color: #374151;
      }

      .cols {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 18pt;
      }

      .left {
        flex: 0 0 46%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 10pt;
      }

      ul {
        padding-left: 26pt;
        display: flex;
        flex-direction: column;
        gap: 8pt;
      }

      li {
        font-size: 16pt;
        line-height: 1.18;
        color: #111827;
      }

      .right {
        flex: 1 1 auto;
        min-height: 0;
        background: #fef9c3;
        border: 2pt solid #fde68a;
        border-radius: 12pt;
        padding: 12pt;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="safe">
      <div class="card">
        <h1>{{TITLE}}</h1>
        <div class="accent"></div>

        <div class="cols">
          <div class="left">
            <p>{{LEAD_IN}}</p>
            <ul>
              <!-- Replace placeholders; delete unused <li> lines to avoid showing {{...}} text. -->
              <li>{{BULLET_1}}</li>
              <li>{{BULLET_2}}</li>
              <li>{{BULLET_3}}</li>
              <li>{{BULLET_4}}</li>
              <li>{{BULLET_5}}</li>
            </ul>
          </div>

          <div class="right">
            <img src="{{IMAGE_PATH}}" alt="Slide image" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
